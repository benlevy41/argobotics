
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nautilus ROV</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family: Arial, sans-serif;
        }

        .container {
            width: min(1400px, 100%);
            margin: 0 auto;
            padding: 12px;
        }

        /* ---------- Header ---------- */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid #333;
            background: #1a1a1a;
        }

        .title {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 0.08em;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #777;
        }

        .status-dot.connected {
            background: #4caf50;
        }

        /* ---------- Main ---------- */

        main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 260px;
            gap: 12px;
            margin-top: 12px;
        }

        /* ---------- Video ---------- */

        .video-panel {
            aspect-ratio: 16 / 9;
            background: #050505;
            border: 1px solid #333;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-panel video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-placeholder {
            color: #555;
            font-size: 1.2rem;
            letter-spacing: 0.08em;
        }

        /* ---------- Control Panel ---------- */

        .control-panel {
            border: 1px solid #333;
            background: #1a1a1a;
            padding: 16px;
        }

        .panel-title {
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            color: #aaa;
            margin-bottom: 16px;
        }

        .control-state {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px 20px;
            margin-bottom: 24px;
        }

        .control-name {
            color: #aaa;
        }

        .control-value {
            min-width: 45px;
            text-align: right;
            font-family: monospace;
            font-size: 1.1rem;
        }

        /* ---------- Buttons ---------- */

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 14px 10px;
            border: 1px solid #555;
            background: #292929;
            color: #eee;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #353535;
        }

        button:active {
            background: #444;
        }

        .stop-button {
            background: #5a2020;
            border-color: #884040;
        }

        .stop-button:hover {
            background: #702828;
        }

        /* ---------- Footer ---------- */

        footer {
            display: flex;
            gap: 24px;
            margin-top: 12px;
            padding: 10px 14px;
            border: 1px solid #333;
            background: #1a1a1a;
            font-size: 0.8rem;
            color: #aaa;
        }

        .connection {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ---------- Mobile ---------- */

        @media (max-width: 800px) {
            main {
                grid-template-columns: 1fr;
            }

            .control-panel {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }

            .panel-title {
                grid-column: 1 / -1;
                margin-bottom: 0;
            }

            .control-state {
                margin-bottom: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="title">NAUTILUS</div>

        <div class="system-status">
            <div id="systemStatusDot" class="status-dot"></div>
            <span id="systemStatus">SYSTEM DISCONNECTED</span>
        </div>
    </header>


    <main>

        <!-- Video -->
        <section class="video-panel">

            <!-- Replace this with your video element -->
            <video id="video" autoplay muted playsinline></video>

            <!-- Shown until video is connected -->
            <div id="videoPlaceholder" class="video-placeholder">
                NO VIDEO
            </div>

        </section>


        <!-- Controls -->
        <aside class="control-panel">

            <div class="panel-title">
                CONTROL
            </div>

            <div class="control-state">

                <div class="control-name">Throttle</div>
                <div id="state-t" class="control-value">0</div>

                <div class="control-name">Yaw</div>
                <div id="state-y" class="control-value">0</div>

                <div class="control-name">Heave</div>
                <div id="state-h" class="control-value">0</div>

                <div class="control-name">Pan</div>
                <div id="state-p" class="control-value">0</div>

                <div class="control-name">Tilt</div>
                <div id="state-l" class="control-value">0</div>

            </div>

            <div class="buttons">

                <button
                    id="allStop"
                    class="stop-button"
                    data-key=" ">
                    ALL STOP
                </button>

                <button
                    id="centerCamera"
                    data-key="0">
                    CENTER CAMERA
                </button>

            </div>

        </aside>

    </main>


    <footer>

        <div class="connection">
            <div id="wsStatusDot" class="status-dot"></div>
            <span>WebSocket:</span>
            <span id="wsStatus">Disconnected</span>
        </div>

        <div class="connection">
            <div id="teensyStatusDot" class="status-dot"></div>
            <span>Teensy:</span>
            <span id="teensyStatus">Disconnected</span>
        </div>

        <div class="connection">
            <div id="videoStatusDot" class="status-dot"></div>
            <span>Video:</span>
            <span id="videoStatus">Disconnected</span>
        </div>

    </footer>

</div>

<script src="app.js"></script>

</body>
</html>
